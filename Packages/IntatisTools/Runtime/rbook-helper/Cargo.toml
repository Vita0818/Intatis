[package]
name = "intatis-rbook-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false

[dependencies]
rbook = "=0.7.10"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

