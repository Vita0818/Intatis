# XcodeGen spec — generates the Xcode project that builds the real .app bundles.
#
#   brew install xcodegen      # one-time
#   xcodegen generate          # creates Intatis.xcodeproj
#   open Intatis.xcodeproj     # pick the IntatisMac or IntatisiOS scheme, then Run
#
# The App targets link the Swift Package products in this repo. The iOS app links
# ONLY the chat subset (no Tools / Permission / AgentKernel / Cowork).

name: Intatis

options:
  bundleIdPrefix: com.Vita0818
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  localPackagesGroup: "Internal Modules"
  postGenCommand: "sh scripts/hide-xcode-package-schemes.sh"

packages:
  Intatis:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.12"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: "NO"
    # To run on a device or archive for distribution, set your team:
    # DEVELOPMENT_TEAM: ABCDE12345

targets:

  # ---- macOS app: full Chat / Code / Cowork (links all 11 library products) ----
  IntatisMac:
    type: application
    platform: macOS
    sources:
      - Apps/IntatisMac/Sources
      - path: Apps/SharedResources
        buildPhase: resources
      - path: NOTICE.md
        buildPhase: resources
      - path: ThirdPartyNotices
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.IntatisMac
        # Let Xcode synthesize Info.plist (injects CFBundleExecutable etc.).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Intatis
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Intatis contributors. See NOTICE.md."
        CODE_SIGN_ENTITLEMENTS: Apps/IntatisMac/IntatisMac.DeveloperID.entitlements
        # AppStore/chat-only builds can still switch back to:
        #   CODE_SIGN_ENTITLEMENTS: Apps/IntatisMac/IntatisMac.AppStore.entitlements
        #   and set AppConfig.platformProfile = .macAppStore
    dependencies:
      - package: Intatis
        product: IntatisCore
      - package: Intatis
        product: IntatisProtocol
      - package: Intatis
        product: IntatisProviders
      - package: Intatis
        product: IntatisConversation
      - package: Intatis
        product: IntatisArtifacts
      - package: Intatis
        product: IntatisMultimodal
      - package: Intatis
        product: IntatisSharedUI
      - package: Intatis
        product: IntatisTools
      - package: Intatis
        product: IntatisPermission
      - package: Intatis
        product: IntatisAgentKernel
      - package: Intatis
        product: IntatisCowork

  # ---- iOS app: chat-only SUBSET (deliberately no workspace stack) ----
  IntatisiOS:
    type: application
    platform: iOS
    sources:
      - Apps/IntatisiOS/Sources
      - Apps/IntatisiOS/Resources
      - path: Apps/SharedResources
        buildPhase: resources
      - path: NOTICE.md
        buildPhase: resources
      - path: ThirdPartyNotices
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.Intatis
        TARGETED_DEVICE_FAMILY: "1,2"
        # Let Xcode synthesize Info.plist (injects CFBundleExecutable etc.).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Intatis
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Intatis uses the microphone for voice input transcription."
    dependencies:
      - package: Intatis
        product: IntatisCore
      - package: Intatis
        product: IntatisProtocol
      - package: Intatis
        product: IntatisProviders
      - package: Intatis
        product: IntatisConversation
      - package: Intatis
        product: IntatisArtifacts
      - package: Intatis
        product: IntatisMultimodal
      - package: Intatis
        product: IntatisSharedUI

schemes:
  IntatisMac:
    build:
      targets:
        IntatisMac: all
    run:
      config: Debug
    management:
      shared: true
      orderHint: 0
      isShown: true

  IntatisiOS:
    build:
      targets:
        IntatisiOS: all
    run:
      config: Debug
    management:
      shared: true
      orderHint: 1
      isShown: true
